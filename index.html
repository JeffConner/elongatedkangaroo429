<!DOCTYPE html>
<!--
  hello. you opened the source. that is the kind of thing Jeff would do.
  there is nothing hidden in here. everything it knows about you, your own
  browser told it: the clock, the time zone, the screen. nothing is uploaded.
  it only feels like someone is in here with you.
  someone is in here with you.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeff added you to a group</title>
<meta name="description" content="Not rated. About fifteen minutes. It remembers you.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0907">
<meta property="og:title" content="Jeff added you to a group">
<meta property="og:description" content="Not rated. About fifteen minutes. It remembers you.">
<meta property="og:image" content="https://jeffconner.github.io/elongatedkangaroo429/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" id="fav" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0907'/%3E%3Cpath d='M9 6h14v12q-2 9-4 9q-2 0-3-7q-1 7-3 7q-2 0-4-9z' fill='%23d9cfb8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0907;--bone:#d9cfb8;--dim:#776d5c;--rust:#9a3a1c;--dried:#3a0f0c;--bile:#8c9548;--panel:#15120e;--line:#2c251c;
  --type:"Special Elite","Courier New",monospace;--ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);min-height:100%}
body{color:var(--bone);font-family:var(--ui);-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input{font:inherit;color:inherit;border-radius:0}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
canvas{display:block}
#grain{position:fixed;inset:0;width:100vw;height:100vh;z-index:40;pointer-events:none;opacity:.1;mix-blend-mode:screen;image-rendering:pixelated}
#vig{position:fixed;inset:0;z-index:39;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 38%,rgba(0,0,0,.8) 100%)}
#cut{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:var(--bone);color:var(--bg);font-family:var(--type);font-size:20vw;line-height:.9;text-align:center;pointer-events:none;padding:10px;word-break:break-word}
body.cut #cut{display:flex}
body.cut #stage{filter:invert(1)}
#toasts{position:fixed;z-index:60;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--rust);padding:10px 12px;font-size:.84rem;line-height:1.3;box-shadow:0 6px 20px rgba(0,0,0,.6);animation:drop .35s ease-out}
.toast b{display:block;font-size:.66rem;color:var(--dim);font-weight:600;margin-bottom:2px}
@keyframes drop{from{transform:translateY(-120%)}}
#snd{position:fixed;z-index:45;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));background:rgba(11,9,7,.7);border:1px solid var(--line);color:var(--dim);padding:5px 8px;font-size:.66rem}
#stage{position:relative;max-width:540px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom))}
.center{min-height:calc(100vh - 80px);min-height:calc(100dvh - 80px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.t{font-family:var(--type)}
h1,h2{font-family:var(--type);font-weight:400}
.big{font-family:var(--type);font-size:1.5rem;line-height:1.3;max-width:20ch}
.mid{font-family:var(--type);font-size:1.08rem;line-height:1.45;max-width:28ch}
.sm{font-size:.76rem;color:var(--dim);line-height:1.5;max-width:34ch}
.k{font-family:var(--type);font-size:.7rem;color:var(--rust)}
.btn{display:inline-block;margin-top:18px;padding:14px 24px;background:var(--bone);color:var(--bg);border:0;font-family:var(--type);font-size:1rem}
.btn:active{background:var(--rust);color:var(--bone)}
.btn.ghost{background:none;color:var(--bone);border:1px solid var(--dim)}
.btn.red{background:none;color:var(--rust);border:1px solid var(--rust)}
.btn[disabled]{opacity:.35}
.stamp{display:inline-block;border:3px double var(--rust);color:var(--rust);font-family:var(--type);padding:6px 14px;transform:rotate(-4deg);font-size:1.3rem;margin-bottom:22px}
.field{width:100%;max-width:300px;margin-top:18px;padding:14px;background:var(--panel);border:1px solid var(--dim);font-family:var(--type);font-size:20px;text-align:center;color:var(--bone);outline:none}
.fade{animation:fade .8s linear}
@keyframes fade{from{opacity:0}}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;width:100%;max-width:330px}
.faces canvas{width:100%;height:auto;border:1px solid var(--line);cursor:pointer}
.step{display:flex;align-items:center;gap:18px;margin-top:18px;font-family:var(--type);font-size:2.4rem}
.step button{width:52px;height:52px;background:none;border:1px solid var(--dim);font-size:1.6rem}
/* feed */
.ghead{border:1px solid var(--line);background:var(--panel);padding:14px}
.ghead h1{font-size:1.4rem;line-height:1.15;margin:6px 0 8px}
.ghead .m{font-size:.78rem;color:var(--dim)}
.ghead .m b{color:var(--bone)}
.post{border:1px solid var(--line);border-top:0;background:var(--panel);padding:13px}
.post .who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.post .who canvas{width:36px;height:36px;border-radius:50%;flex:none}
.post .nm{font-weight:600;font-size:.9rem}
.post .nm i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bile);margin-left:6px}
.post .tm{font-size:.7rem;color:var(--dim)}
.post .tx{font-size:.97rem;line-height:1.45;white-space:pre-line}
.post .rx{margin-top:9px;padding-top:7px;border-top:1px solid var(--line);font-size:.72rem;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.post.hook{border-left:3px solid var(--rust);background:var(--panel)}
.post.hook .btn{margin-top:12px;width:100%}
.post.left{border:1px solid var(--rust);margin:10px 0}
.post.left .tx{font-family:var(--type);font-size:1.2rem}
.compose{border:1px solid var(--line);border-top:0;background:var(--bg);padding:12px;font-size:.9rem;color:var(--dim);min-height:46px}
.compose.typing{color:var(--bone)}
/* shared scene bits */
.bar{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:var(--dim);margin-bottom:12px;font-family:var(--type)}
.cap{font-family:var(--type);font-size:1.05rem;line-height:1.4;min-height:4.4em;text-align:center;margin:12px 0}
.wide{width:100%;height:auto;border:1px solid var(--line);touch-action:none}
/* dm */
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:150px}
.bub{max-width:82%;padding:9px 12px;border-radius:16px;font-size:.96rem;line-height:1.35;animation:fade .3s linear}
.bub.them{align-self:flex-start;background:var(--panel);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--rust);border-bottom-right-radius:4px}
.bub small{display:block;font-size:.62rem;opacity:.7;margin-top:3px}
.dots b{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dim);margin-right:4px;animation:dot 1.2s infinite}
.dots b:nth-child(2){animation-delay:.2s}.dots b:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.replies{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(transparent,var(--bg) 22%);padding:26px 12px calc(38px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;max-width:540px;margin:0 auto}
.replies button{padding:11px;background:var(--panel);border:1px solid var(--dim);font-size:.93rem;text-align:left}
.replies button:active{background:var(--dried)}
/* market */
.item{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-top:0;background:var(--panel);padding:13px;width:100%;text-align:left}
.item:first-of-type{border-top:1px solid var(--line)}
.item b{font-weight:400;font-size:.96rem;line-height:1.3}
.item span{flex:none;font-family:var(--type);color:var(--rust);font-size:.85rem}
.item small{display:block;color:var(--dim);font-size:.72rem;margin-top:3px}
.modal{position:fixed;inset:0;z-index:35;background:rgba(5,4,3,.92);display:flex;align-items:center;justify-content:center;padding:22px}
.modal>div{background:var(--panel);border:1px solid var(--dim);padding:20px;max-width:380px;width:100%;text-align:center}
/* quiz */
.opts{display:flex;flex-direction:column;gap:9px;width:100%;max-width:340px;margin-top:18px}
.opts button{padding:14px;background:var(--panel);border:1px solid var(--dim);font-size:1rem;text-align:left}
.opts button:active{background:var(--dried)}
.prog{width:100%;height:4px;background:var(--line);margin-bottom:22px}
.prog i{display:block;height:100%;background:var(--rust);transition:width .5s}
.doors{display:flex;gap:14px;margin-top:22px}
.doors button{width:76px;height:150px;background:#1c1610;border:2px solid var(--dim);position:relative}
.doors button::after{content:"";position:absolute;right:9px;top:50%;width:7px;height:7px;border-radius:50%;background:var(--dim)}
.doors button.br{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.035,1.012)}}
input[type=range]{width:100%;max-width:320px;margin-top:26px;accent-color:#9a3a1c}
/* tos */
.tos{font-size:.88rem;line-height:1.6;color:#b9af99;padding-bottom:150px}
.tos p{margin-bottom:14px}
.fixbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(40px + env(safe-area-inset-bottom));text-align:center;font-size:.74rem;color:var(--dim)}
.fixbar .btn{margin-top:8px;width:100%;max-width:340px}
/* captcha */
.grid{display:grid;gap:4px;width:100%;max-width:340px;margin:14px auto 0}
.grid canvas{width:100%;height:auto;cursor:pointer;outline:0 solid var(--bile)}
.grid canvas.sel{outline-width:3px;outline-offset:-3px}
/* hold */
.holdwrap{position:relative;width:240px;height:240px;margin-top:20px}
.holdwrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;opacity:0;transition:opacity 4s linear}
.holdbtn{position:absolute;inset:0;border-radius:50%;background:rgba(21,18,14,.55);border:2px solid var(--bone);font-family:var(--type);font-size:1rem;color:var(--bone);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.holdbtn.on{border-color:var(--rust);animation:grip 1s ease-in-out infinite}
@keyframes grip{50%{transform:scale(.955)}}
/* call */
.call{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(70px + env(safe-area-inset-top)) 24px calc(70px + env(safe-area-inset-bottom));text-align:center}
.call canvas{width:130px;height:130px;border-radius:50%;margin:0 auto 16px}
.call .nm{font-size:2rem;font-weight:300}
.call .st{color:#8aa39a;margin-top:6px;font-size:.95rem;min-height:1.4em}
.call .capt{font-family:var(--type);font-size:1.15rem;line-height:1.4;min-height:6em;max-width:24ch}
.call .row{display:flex;gap:60px}
.call .rb{width:70px;height:70px;border-radius:50%;border:0;font-size:.74rem;font-weight:700;color:#fff}
.call .no{background:#c0392b}.call .yes{background:#2e9e5b}
/* mirror, confess, ghost */
.confbox{width:100%;max-width:360px;min-height:150px;margin-top:16px;padding:14px;background:var(--panel);border:1px solid var(--dim);font-size:17px;line-height:1.45;color:var(--bone);outline:none;resize:none;font-family:var(--ui)}
.gp{position:relative;width:100%;height:60vh;max-height:520px;margin-top:10px;background:var(--bg);border:2px solid var(--line);border-radius:22px;overflow:hidden;font-size:.9rem;touch-action:none;user-select:none;-webkit-user-select:none}
.gp .scr{position:absolute;inset:0;padding:16px 14px}
.gp .sb{border:1px solid var(--dim);border-radius:18px;padding:9px 14px;min-height:38px;color:var(--bone)}
.gp .sg{padding:11px 4px;border-bottom:1px solid var(--line);color:#b9af99}
.gp .apps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px;text-align:center;font-size:.72rem;color:var(--dim)}
.gp .apps i{display:block;width:54px;height:54px;border-radius:13px;background:var(--dried);margin:0 auto 6px;border:1px solid var(--line)}
.gp .ph{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:10px}
.gp .ph canvas{width:100%;height:auto}
.gp .note{margin-top:10px;font-family:var(--type);font-size:1.02rem;line-height:1.5;white-space:pre-wrap}
.finger{position:absolute;z-index:5;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(154,58,28,.45);border:2px solid rgba(217,207,184,.6);left:50%;top:110%;transition:left .7s ease-in-out,top .7s ease-in-out,transform .15s;pointer-events:none}
.finger.tap{transform:scale(.7)}
.everyone{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:340px;margin-top:10px;touch-action:none}
.everyone canvas{width:100%;height:auto}
/* editions move differently */
@keyframes sway{0%,100%{transform:translateX(-3px) rotate(-.3deg)}50%{transform:translateX(3px) rotate(.3deg)}}
@keyframes pulse{50%{transform:scale(1.014)}}
@keyframes jit{0%,90%,100%{transform:none}92%{transform:translate(2px,-1px)}94%{transform:translate(-2px,1px) skewX(1.2deg)}96%{transform:translate(1px,1px)}}
@keyframes wob{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}}
body.ed-1 .post,body.ed-1 .ghead,body.ed-1 .wide,body.ed-1 .big,body.ed-1 .item{animation:sway 9s ease-in-out infinite;border-radius:14px}
body.ed-1 .post:nth-child(even){animation-delay:-4.5s}
body.ed-2 .post,body.ed-2 .ghead,body.ed-2 .wide,body.ed-2 .big,body.ed-2 .item{animation:pulse 4.2s ease-in-out infinite}
body.ed-2 .post{border-left:4px solid var(--dried)}
body.ed-3{font-family:var(--type)}
body.ed-3 .post,body.ed-3 .ghead,body.ed-3 .wide,body.ed-3 .big,body.ed-3 .item{animation:jit 5s steps(1) infinite}
body.ed-3 .post:nth-child(odd){animation-delay:-2.3s}
body.ed-4 .post,body.ed-4 .ghead,body.ed-4 .wide,body.ed-4 .big,body.ed-4 .item{animation:wob 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){body .post,body .ghead,body .wide,body .big,body .item,body .btn{animation:none!important}}
/* final */
.card{width:100%;max-width:340px;height:auto;border:1px solid var(--dim);margin-top:14px}
.end{font-family:var(--type);font-size:1.15rem;line-height:1.5;max-width:26ch}
@media (prefers-reduced-motion:reduce){.toast,.fade,.bub{animation:none}.doors button.br{animation:breathe 3.2s ease-in-out infinite}}
</style>
</head>
<body>
<canvas id="grain" width="96" height="170" aria-hidden="true"></canvas>
<div id="vig" aria-hidden="true"></div>
<div id="cut" aria-hidden="true"></div>
<div id="toasts" aria-live="polite"></div>
<button id="snd" type="button">sound: on</button>
<main id="stage"></main>
<script src="js/core.js"></script>
<script src="js/ed.js"></script>
<script src="js/scenes-a.js"></script>
<script src="js/scenes-b.js"></script>
<script src="js/scenes-c.js"></script>
<script src="js/scenes-d.js"></script>
<script>J.go('gate')</script>
</body>
</html>
